name: Publish research website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check browser scripts
        run: |
          node --check assets/js/site.js
          node --check assets/js/motion.js
      - name: Build static website
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 tools/build_site.py --base-url "$SITE_BASE_URL/"
      - name: Verify release files
        run: python3 tools/verify_site.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
